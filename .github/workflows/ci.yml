name: Ritvik's Production CI Workflow

on:
  push:
    branches:
      - main  

jobs:
  build-and-ship:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      # 1. Build and push backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8app-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/k8app-backend:${{ github.sha }}

      # 2. Building fornend image through nginx Dockerfile
      - name: Build and Push Nginx Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./nginx/Dockerfile  
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8app-nginx:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/k8app-nginx:${{ github.sha }}
